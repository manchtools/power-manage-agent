name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  integration-tests:
    name: Integration Tests
    uses: ./.github/workflows/integration-test.yml

  build:
    name: Build (${{ matrix.arch }})
    needs: [integration-tests]
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5

      - name: Resolve SDK ref
        id: sdk_ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if git ls-remote --tags https://github.com/MANCHTOOLS/power-manage-sdk.git "refs/tags/${TAG}" | grep -q .; then
            echo "ref=${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout SDK
        uses: actions/checkout@v5
        with:
          repository: MANCHTOOLS/power-manage-sdk
          ref: ${{ steps.sdk_ref.outputs.ref }}
          path: _sdk

      - name: Rewrite SDK replace directive
        run: go mod edit -replace github.com/manchtools/power-manage/sdk=./_sdk

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Detect prerelease
        id: prerelease
        run: |
          if [[ "$GITHUB_REF_NAME" == *-rc* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build agent
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_PUBLIC_KEY" ]; then
            echo "RELEASE_SIGNING_PUBLIC_KEY repository variable is required" >&2
            exit 1
          fi
          go build -ldflags="-s -w -X main.version=${{ steps.version.outputs.version }} -X github.com/manchtools/power-manage/agent/internal/executor.releaseSigningPublicKey=${RELEASE_SIGNING_PUBLIC_KEY}" \
            -o dist/power-manage-agent-linux-${{ matrix.arch }} ./cmd/power-manage-agent

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: agent-${{ matrix.arch }}
          path: dist/

  # docref: begin release-signing
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build]
    environment: release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts/

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        env:
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_PUBLIC_KEY" ]; then
            echo "RELEASE_SIGNING_PUBLIC_KEY repository variable is required" >&2
            exit 1
          fi
          mkdir -p release
          cp artifacts/agent-amd64/* release/
          cp artifacts/agent-arm64/* release/
          cp install.sh release/
          sed -i "s|__RELEASE_SIGNING_PUBLIC_KEY__|${RELEASE_SIGNING_PUBLIC_KEY}|g" release/install.sh
          if grep -q '__RELEASE_SIGNING_PUBLIC_KEY__' release/install.sh; then
            echo "release installer still contains the public-key placeholder" >&2
            exit 1
          fi
          cd release
          sha256sum power-manage-agent-linux-amd64 power-manage-agent-linux-arm64 install.sh > SHA256SUMS

      - name: Sign release checksum manifest
        env:
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
          RELEASE_SIGNING_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          if [ -z "$RELEASE_SIGNING_PRIVATE_KEY" ] || [ -z "$RELEASE_SIGNING_PUBLIC_KEY" ]; then
            echo "protected release signing key and public key are required" >&2
            exit 1
          fi
          umask 077
          private_key="${RUNNER_TEMP}/release-signing-private.pem"
          cleanup_private_key() {
            rm -f "$private_key"
          }
          trap cleanup_private_key EXIT
          printf '%s' "$RELEASE_SIGNING_PRIVATE_KEY" > "$private_key"
          if ! openssl pkey -in "$private_key" -text -noout | grep -Fqx 'ED25519 Private-Key:'; then
            echo "RELEASE_SIGNING_PRIVATE_KEY must be an Ed25519 key" >&2
            exit 1
          fi
          derived_public=$(openssl pkey -in "$private_key" -pubout -outform DER | base64 -w0)
          if [ "$derived_public" != "$RELEASE_SIGNING_PUBLIC_KEY" ]; then
            echo "release signing private key does not match RELEASE_SIGNING_PUBLIC_KEY" >&2
            exit 1
          fi
          openssl pkeyutl -sign -rawin -inkey "$private_key" \
            -in release/SHA256SUMS -out release/SHA256SUMS.sig
      # docref: end release-signing

      - name: Generate changelog
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          {
            echo "## What's Changed"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              for entry in "feat:Features" "fix:Bug Fixes" "perf:Performance" "refactor:Refactoring" "docs:Documentation" "test:Tests" "chore:Chores"; do
                prefix="${entry%%:*}"
                label="${entry#*:}"
                items=$(git log --pretty=format:"%s" "${PREV_TAG}..${GITHUB_REF_NAME}" | grep "^${prefix}[:(]" | sed "s/^${prefix}[^:]*: //" || true)
                if [ -n "$items" ]; then
                  echo "### ${label}"
                  echo "$items" | while IFS= read -r line; do echo "- ${line}"; done
                  echo ""
                fi
              done
              others=$(git log --pretty=format:"%s" "${PREV_TAG}..${GITHUB_REF_NAME}" | grep -v "^\(feat\|fix\|perf\|refactor\|docs\|test\|chore\)[:(]" || true)
              if [ -n "$others" ]; then
                echo "### Other Changes"
                echo "$others" | while IFS= read -r line; do echo "- ${line}"; done
                echo ""
              fi
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${GITHUB_REF_NAME}"
            else
              echo "Initial release."
            fi
          } > changelog.md

      - name: Generate release body
        run: |
          TAG="${{ github.ref_name }}"
          cat changelog.md > body.md
          echo "" >> body.md
          if [[ "${{ needs.build.outputs.is_prerelease }}" == "true" ]]; then
            cat >> body.md <<EOF
          ## Installation

          \`\`\`bash
          curl -fsSL https://github.com/MANCHTOOLS/power-manage-agent/releases/latest/download/install.sh | sudo bash -s -- --pre -s https://your-server.example.com -t YOUR_TOKEN
          \`\`\`

          Or install this specific version:

          \`\`\`bash
          curl -fsSL https://github.com/MANCHTOOLS/power-manage-agent/releases/download/${TAG}/install.sh | sudo bash -s -- -v ${TAG} -s https://your-server.example.com -t YOUR_TOKEN
          \`\`\`

          ## Update

          To update an already registered agent to the latest prerelease:

          \`\`\`bash
          curl -fsSL https://github.com/MANCHTOOLS/power-manage-agent/releases/latest/download/install.sh | sudo bash -s -- --pre
          \`\`\`

          Or update to this specific version:

          \`\`\`bash
          curl -fsSL https://github.com/MANCHTOOLS/power-manage-agent/releases/download/${TAG}/install.sh | sudo bash -s -- -v ${TAG}
          \`\`\`

          The update stops the running service, downloads the new binary, updates the sudoers configuration, and restarts the service. Existing registration and credentials are preserved.
          EOF
          else
            cat >> body.md <<EOF
          ## Installation

          \`\`\`bash
          curl -fsSL https://github.com/MANCHTOOLS/power-manage-agent/releases/latest/download/install.sh | sudo bash -s -- -s https://your-server.example.com -t YOUR_TOKEN
          \`\`\`

          Or install a specific version:

          \`\`\`bash
          curl -fsSL https://github.com/MANCHTOOLS/power-manage-agent/releases/download/${TAG}/install.sh | sudo bash -s -- -v ${TAG} -s https://your-server.example.com -t YOUR_TOKEN
          \`\`\`

          ## Update

          To update an already registered agent to the latest version:

          \`\`\`bash
          curl -fsSL https://github.com/MANCHTOOLS/power-manage-agent/releases/latest/download/install.sh | sudo bash
          \`\`\`

          Or update to this specific version:

          \`\`\`bash
          curl -fsSL https://github.com/MANCHTOOLS/power-manage-agent/releases/download/${TAG}/install.sh | sudo bash -s -- -v ${TAG}
          \`\`\`

          The update stops the running service, downloads the new binary, updates the sudoers configuration, and restarts the service. Existing registration and credentials are preserved.
          EOF
          fi
          cat >> body.md <<'EOF'

          ## Binaries

          | Binary | Platform |
          |--------|----------|
          | `power-manage-agent-linux-amd64` | Linux x86_64 |
          | `power-manage-agent-linux-arm64` | Linux ARM64 |
          EOF

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ needs.build.outputs.is_prerelease == 'true' }}
          name: Power Manage Agent ${{ steps.version.outputs.version }}
          files: release/*
          body_path: body.md
